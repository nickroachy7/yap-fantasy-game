name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: the older run's answer is
# already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `expo-env.d.ts` and `.expo/types/router.d.ts` are GENERATED and both
      # gitignored, so a fresh clone has neither. Without them tsc cannot
      # resolve `@/global.css` or the CSS modules, and — more quietly — every
      # expo-router route string goes unchecked, which is the exact coverage
      # this repo turned on deliberately. `customize tsconfig.json` is the
      # documented way to regenerate both; it rewrites tsconfig.json to a
      # byte-identical file, verified, so nothing here depends on it not.
      - name: Generate Expo types (gitignored, so absent on a fresh clone)
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The icon set's own gate. Deno rather than node because the system, the
      # glyphs and the validator are TypeScript with no build step — and it has
      # to run AFTER setup-deno for the same reason the unit tests do.
      #
      # It is a real gate, not a formality: it has already caught a glyph
      # imported off-centre, four refused for sitting at 114% of their keyline,
      # and two whole groups traced from a speckle field at 24,000 coordinates
      # apiece. Every one of those passed typecheck and lint.
      - name: Icon set lint
        run: npm run icons:lint

      - name: Unit tests (Deno)
        run: npm run test:unit

      - name: SQL suites — not run here
        run: |
          echo "The suites in supabase/tests/*.test.sql are SKIPPED in CI."
          echo "They need a live Postgres and a DATABASE_URL secret that is not set"
          echo "on this repository. Run them locally before a release:"
          echo
          echo "  export DATABASE_URL='postgresql://postgres.<ref>:<password>@...pooler.supabase.com:5432/postgres'"
          echo "  npm run test:sql"
          echo
          echo "See docs/testing.md."

  # ── SHIP THE JS TO TESTERS ───────────────────────────────────────────────
  #
  # `needs: check` is the whole point: a push that fails typecheck, lint or the
  # unit suites must not reach anyone's phone. Publishing is gated on green.
  #
  # This only ships JAVASCRIPT. Native changes — a new module with native code,
  # icon/splash/permissions, an SDK bump, or a change to `expo.version` — still
  # need a local Xcode archive and a TestFlight upload. See docs and the
  # `runtimeVersion` note below.
  #
  # `runtimeVersion` is the `appVersion` policy, so an update only lands on
  # builds whose `expo.version` matches. Bumping `expo.version` silently strands
  # every existing install until testers reinstall from TestFlight — so bump
  # `ios.buildNumber` for new binaries and leave `version` alone.
  publish:
    name: publish OTA update
    needs: check
    # Pushes to main only. A PR must not publish — it has not been merged, and
    # updates go to real testers' phones.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fail loudly and early rather than letting eas-cli emit an opaque auth
      # error a few minutes into the run.
      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create one at"
            echo "::error::https://expo.dev/settings/access-tokens and add it under"
            echo "::error::GitHub repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install --global eas-cli

      # `--platform ios` is load-bearing. `platform=all` static-renders the web
      # build in Node, which executes src/lib/supabase.ts and throws on the
      # missing env — the export dies before anything publishes.
      #
      # The commit message goes through an env var rather than `${{ }}`
      # interpolation: a message containing quotes or `$(...)` would otherwise
      # be executed by the shell. Only the first line is used, since --message
      # is a single line.
      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="${COMMIT_MSG%%$'\n'*}"
          [ -n "$MSG" ] || MSG="${GITHUB_SHA:0:7}"
          eas update \
            --branch production \
            --message "$MSG" \
            --environment production \
            --platform ios \
            --non-interactive

  # ── SHIP THE WEBSITE ─────────────────────────────────────────────────────
  #
  # The Vercel project was recreated from the CLI after the Aug 25 takedown,
  # and a CLI-created project has NO GitHub integration — nothing on Vercel's
  # side reacts to a push. Without this job, a green push ships the OTA update
  # to phones while yapfantasy.com silently keeps serving the previous build.
  #
  # `needs: check` for the same reason `publish` has it: the site and the app
  # ship together, and only when the suite is green.
  #
  # `.vercel/` is gitignored, so the runner has no project link. The CLI reads
  # VERCEL_ORG_ID / VERCEL_PROJECT_ID from the environment instead. These are
  # identifiers, not credentials — only the token is secret.
  #
  # This uploads source and builds ON Vercel, so the build picks up the
  # EXPO_PUBLIC_* variables configured on the project's Production environment.
  # Those are a THIRD home for env alongside .env.local and EAS: a var added to
  # only the first two builds fine here and ships a site with no Supabase client.
  deploy-web:
    name: deploy website
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same reasoning as the EXPO_TOKEN guard above: fail in seconds with a
      # message that says what to do, rather than an opaque auth error later.
      - name: Require VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Create one at"
            echo "::error::https://vercel.com/account/settings/tokens and add it with"
            echo "::error::gh secret set VERCEL_TOKEN"
            exit 1
          fi

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_mwQiRIZNbSOvqOJJIDWuQriK
          VERCEL_PROJECT_ID: prj_lcHZrKfnRGge5RkNi1Ib2ZeHk8op
        run: npx --yes vercel@51 deploy --prod --yes --token "$VERCEL_TOKEN"
